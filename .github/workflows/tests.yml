name: Browser tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'script-companion-source.zip'
      - '.upload-parts/**'
      - '.github/workflows/import-source.yml'
      - '.github/workflows/assemble-source.yml'
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ['Import approved source package', 'Assemble approved source upload']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  reader:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run offline-reader and simulated-sync tests
        run: python Tests/run_all.py --browser-only
      - name: Upload logs, reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-evidence
          path: |
            Tests/artifacts/
            Tests/*.png
          retention-days: 14
          if-no-files-found: warn
